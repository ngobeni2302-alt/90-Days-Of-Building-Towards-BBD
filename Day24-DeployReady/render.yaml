# Deploy to Render.com - free - BBD deploy standard
services:
  - type: web
    name: bbd-employee-system
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
