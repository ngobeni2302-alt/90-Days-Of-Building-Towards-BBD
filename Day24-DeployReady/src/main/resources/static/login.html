<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BBD Login - Day 24</title>
<style>*{box-sizing:border-box;font-family:Inter,sans-serif}body{background:#0f0f0f;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:#1c1c1e;padding:30px;border-radius:12px;width:350px;border:1px solid #2c2c2e}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#2c2c2e;color:#fff}button{width:100%;padding:12px;background:#ff3b30;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}button:hover{background:#ff1a0f}h2 span{color:#ff3b30}</style></head><body>
<div class="card">
<h2>BBD <span>System</span> Live</h2><p style="color:#888;font-size:13px">Day 24 / 90 - Deployed to cloud</p>
<input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button><button onclick="register()" style="background:#2c2c2e">Register</button>
<div id="msg" style="color:#ff3b30;margin-top:10px;font-size:13px"></div>
<p style="color:#555;font-size:11px;margin-top:15px">Tip: Register first, then login. Token stored in localStorage. Backend health: <a href="/api/employees/health" style="color:#ff3b30">/api/employees/health</a></p>
</div>
<script>
async function register(){let u=document.getElementById('username').value,p=document.getElementById('password').value;let res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let d=await res.json();document.getElementById('msg').innerText=d.message||d.error;}
async function login(){let u=document.getElementById('username').value,p=document.getElementById('password').value;let res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let d=await res.json();if(d.token){localStorage.setItem('token',d.token);localStorage.setItem('username',d.username);window.location.href='/index.html';}else document.getElementById('msg').innerText=d.error;}
</script></body></html>
