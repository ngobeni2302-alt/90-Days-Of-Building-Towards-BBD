# H2 for local, Postgres for prod via env variables
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:companydb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:}
