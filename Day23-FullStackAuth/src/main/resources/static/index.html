<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BBD System - Day 23</title>
<style>*{box-sizing:border-box;font-family:Inter,sans-serif}body{background:#0f0f0f;color:#fff;margin:0;padding:20px}h1{color:#ff3b30}h1 span{color:#fff}.card{background:#1c1c1e;border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #2c2c2e}input,select,button{padding:10px;border-radius:8px;border:1px solid #333;background:#2c2c2e;color:#fff;margin:5px}button{background:#ff3b30;border:none;cursor:pointer;font-weight:700}button:hover{background:#ff1a0f}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #2c2c2e}th{color:#888}.stats{display:flex;gap:15px;flex-wrap:wrap}.stat{background:#2c2c2e;padding:15px;border-radius:10px;min-width:150px}.stat b{color:#ff3b30;font-size:22px}</style></head><body>
<h1>BBD<span> Dashboard</span> <small style="color:#888">Day 23 - JWT Protected</small> <button onclick="logout()" style="float:right;background:#2c2c2e">Logout (<span id="user"></span>)</button></h1>
<div class="card stats" id="stats">Loading...</div>
<div class="card"><h3>Add Employee</h3><input id="name" placeholder="Name"><input id="role" placeholder="Role"><input id="salary" type="number" placeholder="Salary"><select id="dept"><option>Engineering</option><option>QA</option><option>DevOps</option><option>HR</option></select><button onclick="createEmp()">Add</button></div>
<div class="card"><h3>Employees</h3><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Dept</th><th>Salary</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table></div>
<script>
const API='/api/employees';
const token=localStorage.getItem('token');
if(!token){ window.location.href='/login.html'; }
document.getElementById('user').innerText=localStorage.getItem('username')||'';
function authHeaders(){ return {'Content-Type':'application/json','Authorization':'Bearer '+token}; }
async function loadStats(){
 let res=await fetch(API+'/stats',{headers:{'Authorization':'Bearer '+token}});
 if(res.status==401||res.status==403){ logout(); return; }
 let data=await res.json();
 document.getElementById('stats').innerHTML=`<div class="stat"><div>Staff</div><b>${data.count}</b></div><div class="stat"><div>Payroll</div><b>R ${data.totalPayroll.toFixed(2)}</b></div><div class="stat"><div>Avg</div><b>R ${data.avgSalary.toFixed(0)}</b></div>`;
}
async function loadEmployees(){
 let res=await fetch(API,{headers:{'Authorization':'Bearer '+token}});
 if(res.status==401||res.status==403){ logout(); return; }
 let list=await res.json();
 document.getElementById('tbody').innerHTML=list.map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td>${e.role}</td><td>${e.department}</td><td>R ${e.salary}</td><td><button onclick="deleteEmp(${e.id})" style="background:#333">Delete</button></td></tr>`).join('');
 loadStats();
}
async function createEmp(){
 let body={name:document.getElementById('name').value,role:document.getElementById('role').value,salary:parseFloat(document.getElementById('salary').value),department:document.getElementById('dept').value};
 let res=await fetch(API,{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
 if(res.ok) loadEmployees();
}
async function deleteEmp(id){ await fetch(API+'/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}}); loadEmployees(); }
function logout(){ localStorage.removeItem('token'); localStorage.removeItem('username'); window.location.href='/login.html'; }
loadEmployees();
</script></body></html>
